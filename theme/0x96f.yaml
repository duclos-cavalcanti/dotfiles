scheme: "0x96f"
author: "Ghostty 0x96f (terminal, verbatim) + inferred base16 -- macfiles"

# --- terminal: 16 ANSI colors + UI, ground truth (copied verbatim from the
#     source theme; here Ghostty's built-in 0x96f). Consumed by `base16 ghostty`.
background: "262427"
foreground: "fcfcfa"
cursor: "fcfcfa"
cursor-text: "000000"
selection-background: "fcfcfa"
selection-foreground: "262427"
color00: "262427"
color01: "ff666d"
color02: "b3e03a"
color03: "ffc739"
color04: "00cde8"
color05: "a392e8"
color06: "9deaf6"
color07: "fcfcfa"
color08: "545452"
color09: "ff7e83"
color10: "bee55e"
color11: "ffd05e"
color12: "1bd5eb"
color13: "b0a3eb"
color14: "acedf8"
color15: "fcfcfa"

# --- base16: for mini.base16 (nvim), consumed by `base16 lua`. A mix of direct
#     copies from the 16 above and inferred slots:
#       copies : 08<-color1 0A<-color3 0B<-color2 0C<-color6 0D<-color4 0E<-color5
#                00<-background 03<-color8 05<-foreground
#       inferred: 01 02 04 06 07 (ramp steps -- 0x96f inverts its selection, so
#                base02 can't copy selection-background), 09 (orange), 0F (coral).
base00: "262427"
base01: "2e2c2f"
base02: "3f3d3e"
base03: "545452"
base04: "b3b3b1"
base05: "fcfcfa"
base06: "fefefe"
base07: "ffffff"
base08: "ff666d"
base09: "ff9f43"
base0A: "ffc739"
base0B: "b3e03a"
base0C: "9deaf6"
base0D: "00cde8"
base0E: "a392e8"
base0F: "f76e5e"

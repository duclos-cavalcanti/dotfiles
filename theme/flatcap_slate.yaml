author: "Flatcap Slate by Cheycron Blaine (terminal, verbatim) + token-mapped base16 -- macfiles"

# --- terminal: 16 ANSI colors + UI, ground truth (copied verbatim from the
#     source theme; here flatcap-wezterm's colors/Flatcap Slate.toml, v2.0.0,
#     https://github.com/cheycron/flatcap-wezterm). Consumed by `base16 ghostty`.
background: "191d22"
foreground: "d5dbe3"
cursor: "9bbfdf"
cursor-text: "101820"
selection-background: "3c546b"
selection-foreground: "d5dbe3"
color00: "3d4652"

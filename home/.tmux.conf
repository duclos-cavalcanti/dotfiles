# Prefix
set -g prefix C-a
bind C-a send-prefix

# General
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
set -g mouse on
set -s escape-time 1
set -g base-index 0
set -g pane-base-index 0
set -g display-panes-time 3000
set -g repeat-time 1000
set -g focus-events on
set -g automatic-rename off
set -g renumber-windows on
setw -g mode-keys vi
setw -g aggressive-resize on
set -g extended-keys on
set -g extended-keys-format csi-u

# Hooks
set-hook -g client-focus-in                 'resize-window -A'
set-hook -g client-attached                 'resize-window -A'
set-hook -g client-resized                  'resize-window -A'
set-hook -g client-session-changed          'resize-window -A'

# Copy mode
bind y copy-mode
bind -T copy-mode-vi  v  send-keys -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

# Panes — management
bind x kill-pane
unbind C-o          # default rotate-window; unused (use P swap-pane instead)

# Panes — navigation
bind o select-pane -t :.+
bind O select-pane -t :.+ \; resize-pane -Z   # next pane, then zoom it
bind -r \; last-pane
bind Enter  resize-pane -Z

# marked pane (★): jump to it / swap current pane with it
bind-key j switch-client -t '{marked}'
bind     P swap-pane

# Windows — navigation
bind -r p select-window -t :-
bind -r n select-window -t :+
bind    l last-window

# Windows — reordering
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Windows — resizing
bind C-l resize-window -A

# Sessions
bind    L switch-client -l
bind -r ) switch-client -n
bind -r ( switch-client -p
bind    S switch-client -t system
bind    N command-prompt -p "new session name:" "new-session -s '%%' -c '#{pane_current_path}'"

# Source
bind r      source-file ~/.tmux.conf \; refresh-client -S \; display "config reloaded"

# Crew -- registered agent sessions: registry (add/jump/edit)
bind h           switch-client -T crew

bind -T crew a      run-shell '~/.config/crew/crew add'
bind -T crew h      display-popup -E -w 50% -h 40% '~/.config/crew/crew pick'
bind -T crew e      display-popup -E -w 80% -h 80% '~/.config/crew/crew edit'
bind -T crew 1      run-shell '~/.config/crew/crew go 1'
bind -T crew 2      run-shell '~/.config/crew/crew go 2'
bind -T crew 3      run-shell '~/.config/crew/crew go 3'
bind -T crew 4      run-shell '~/.config/crew/crew go 4'
bind -T crew 5      run-shell '~/.config/crew/crew go 5'
bind -T crew (      run-shell '~/.config/crew/crew go prev'
bind -T crew )      run-shell '~/.config/crew/crew go next'

# Status
bind t      set -g status

# Reset statefully-rebuilt status options
set -gu status-format

# Appearance --messages
set -g message-style                'fg=white'
set -g message-command-style        'fg=white'

# Appearance --panes
set -g pane-active-border-style     'fg=yellow'
set -g pane-border-style            'fg=white'
set -g pane-border-status           top
set -g pane-border-format           '#(~/.config/tmux/pane-status.sh #P #{pane_active} #{pane_current_command} #{pane_current_path} #{pane_pid})'

# Appearance --windows
set -g window-style                 'bg=default'
set -g window-active-style          'bg=default'
set -g window-status-separator      ''
set -g window-status-format         ' #I:#W#{?window_marked_flag, *,} '
set -g window-status-current-format '#[bg=yellow,fg=black] #I:#W#{?window_zoomed_flag, Z,}#{?window_marked_flag, *,} '

# Appearance --status bar
set -g status on
set -g status-style                 'bg=default,fg=default'
set -g status-position              bottom
set -g status-justify               centre
set -g status-interval              5
set -g status-left-length           30
set -g status-right-length          100
set -g status-left                  '#{?client_prefix,#[bg=yellow]#[fg=black],} #S #[default]'
set -g status-right                 '#[bg=yellow,fg=black] disk #[bg=gray,fg=black]#(~/.bin/disk-info) #[default] #[bg=yellow,fg=black] ram #[bg=gray,fg=black]#(~/.bin/ram-info) #[default] #[bg=yellow,fg=black] cpu #[bg=gray,fg=black]#(~/.bin/cpu-info) #[default]'

if-shell '[ "$(tmux -V | cut -c6- | cut -d. -f1)" -ge 3 ]' {
    set -g status 2
    set -g "status-format[1]" "#(~/.config/tmux/statusline-secondary.sh #{session_name})"
}


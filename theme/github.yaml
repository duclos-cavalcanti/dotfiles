scheme: "GitHub"
author: "Ghostty GitHub (terminal, verbatim) + usability-derived base16 -- macfiles"

# --- terminal: 16 ANSI colors + UI, ground truth (copied verbatim from the
#     source theme; here Ghostty's built-in GitHub). Consumed by `base16 ghostty`.
background: "f4f4f4"
foreground: "3e3e3e"
cursor: "3f3f3f"
cursor-text: "f4f4f4"
selection-background: "a9c1e2"
selection-foreground: "535353"
color00: "3e3e3e"
color01: "970b16"
color02: "07962a"
color03: "c5bb94"
color04: "003e8a"
color05: "e94691"
color06: "7cc4df"
color07: "b2b2b2"
color08: "666666"
color09: "de0000"
color10: "7ac895"
color11: "d7b600"
color12: "2e6cba"
color13: "f29592"
color14: "00c7cb"
color15: "ffffff"

# --- base16: for mini.base16 (nvim). LIGHT scheme -> ramp runs light -> dark
#     (base00 lightest bg -> base07 darkest). Hand-derived for a usable light
#     editor palette.
#       ramp   : 00 bg (light); 02<-selection-background; 03<-color8 (comment gray);
#                04<-selection-foreground; 05<-foreground; 01/06/07 inferred.
#       accents: 08<-color1 0B<-color2 0D<-color4 0E<-color5 0C<-color6 (theme's
#                normals, dark enough for white). 0A uses color11 (gold) not the
#                pale color3 tan; 09 (orange) and 0F (brown) inferred -- no ANSI slot.
base00: "f4f4f4"
base01: "e8e8e8"
base02: "a9c1e2"
base03: "666666"
base04: "535353"
base05: "3e3e3e"
base06: "2a2a2a"
base07: "1a1a1a"
base08: "970b16"
base09: "e36209"
base0A: "d7b600"
base0B: "07962a"
base0C: "7cc4df"
base0D: "003e8a"
base0E: "e94691"
base0F: "984b2f"

scheme: "Broadcast"
author: "Ghostty Broadcast (terminal, verbatim) + inferred base16 -- macfiles"

# --- terminal: 16 ANSI colors + UI, ground truth (copied verbatim from the
#     source theme; here Ghostty's built-in Broadcast). Consumed by `base16 ghostty`.
background: "2b2b2b"
foreground: "e6e1dc"
cursor: "ffffff"
cursor-text: "c0bbb6"
selection-background: "5a647e"
selection-foreground: "e6e1dc"
color00: "000000"
color01: "da4939"
color02: "519f50"
color03: "ffd24a"
color04: "6d9cbe"
color05: "d0d0ff"
color06: "6e9cbe"
color07: "ffffff"
color08: "585858"
color09: "ff7b6b"
color10: "83d182"
color11: "ffff7c"
color12: "9fcef0"
color13: "ffffff"
color14: "a0cef0"
color15: "ffffff"

# --- base16: for mini.base16 (nvim), consumed by `base16 lua`. A mix of direct
#     copies from the 16 above and inferred slots:
#       copies : 08<-color1 0A<-color3 0B<-color2 0C<-color6 0D<-color4 0E<-color5
#                00<-background 02<-selection-background 03<-color8 05<-foreground
#       inferred: 01 04 06 07 (ramp steps), 09 (orange), 0F (coral) -- no ANSI slot.
base00: "2b2b2b"
base01: "373737"
base02: "5a647e"
base03: "585858"
base04: "c0bbb6"
base05: "e6e1dc"
base06: "f0ebe6"
base07: "ffffff"
base08: "da4939"
base09: "cc7833"
base0A: "ffd24a"
base0B: "519f50"
base0C: "6e9cbe"
base0D: "6d9cbe"
base0E: "d0d0ff"
base0F: "ff7b6b"

color11: "d8bc87"
color12: "accce7"
color13: "b6aed5"
color14: "abc9cb"
color15: "d5dbe3"

# --- base16: for mini.base16 (nvim), consumed by `base16 lua`. Mapped from the
#     theme's own semantic tokens (src/theme.json), not inferred:
#       ramp   : 00<-bg.canvas 01<-bg.raised 02<-selection.bg 03<-syntax.comment
#                04<-text.secondary 05<-text.primary 07<-contrast.text.primary;
#                06 inferred (midpoint of 05 and 07).
#       accents: 08<-danger.fg 09<-syntax.type 0A<-warning.fg 0B<-success.fg
#                0C<-syntax.function 0D<-accent.fg 0E<-syntax.number
#                0F<-border.control.
base00: "191d22"
base01: "292f36"
base02: "3c546b"
base03: "a7b3c2"
base04: "aeb8c4"
base05: "d5dbe3"
